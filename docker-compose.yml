version: '3.8'

services:
  # 1. Database Service (Postgres)
  postgres:
    image: postgres:13-alpine
    container_name: postgres_container
    # .env.docker 파일의 변수(POSTGRES_...)를 자동으로 컨테이너에 주입
    env_file:
      - ./.env.docker
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # 2. Backend Service
  backend:
    build: 
      context: ./Back
      dockerfile: Dockerfile
    container_name: backend_container
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    # 루트의 .env.docker 파일을 로드하여 Backend 컨테이너에 주입
    env_file:
      - ./.env.docker
      - ./Back/.env
    environment:
      # DB_HOST는 docker-compose 내부 통신을 위해 'postgres' 서비스명으로 고정
      - DB_HOST=postgres
    networks:
      - frontend_net
      - backend_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # 3. Frontend Service
  frontend:
    build: 
      context: ./Front
      dockerfile: Dockerfile
    container_name: frontend_container
    ports:
      - "80:8080"
    depends_on:
      - backend
    networks:
      - frontend_net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # 4. Chat Service (Rust)
  chat:
    build:
      context: ./Chat
      dockerfile: Dockerfile
    container_name: chat_container
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    env_file:
      - ./.env.docker
    environment:
      - PORT=3000
      - DB_HOST=postgres
    networks:
      - frontend_net
      - backend_net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

volumes:
  postgres_data:

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge