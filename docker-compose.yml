version: '3.8'

services:
  # 1. Database Service (Postgres)
  postgres:
    image: postgres:13-alpine
    container_name: postgres_container
    # .env.docker 파일의 변수(POSTGRES_...)를 자동으로 컨테이너에 주입
    env_file:
      - ./.env.docker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Backend Service
  backend:
    build: 
      context: ./Back
      dockerfile: Dockerfile
    container_name: backend_container
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    # 루트의 .env.docker 파일을 로드하여 Backend 컨테이너에 주입
    env_file:
      - ./.env.docker
    environment:
      # DB_HOST는 docker-compose 내부 통신을 위해 'postgres' 서비스명으로 고정
      # 다만 .env.docker에 이미 DB_HOST=postgres로 되어 있다면 오버라이드 안 해도 되지만,
      # 명시성을 위해 남겨두거나 생략 가능. 여기서는 .env 값을 그대로 따르도록 함.
      - DB_HOST=postgres
    volumes:
      - ./Back:/app

  # 3. Frontend Service
  frontend:
    build: 
      context: ./Front
      dockerfile: Dockerfile
    container_name: frontend_container
    ports:
      - "80:80"
    depends_on:
      - backend

  # 4. Chat Service (Rust)
  chat:
    build:
      context: ./Chat
      dockerfile: Dockerfile
    container_name: chat_container
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    env_file:
      - ./.env.docker
    environment:
      - PORT=3000
      - DB_HOST=postgres

volumes:
  postgres_data: