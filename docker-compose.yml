version: '3.8'

services:
  # 0. Reverse Proxy + SSL (Caddy)
  caddy:
    image: caddy:2-alpine
    container_name: caddy_container
    ports:
      - "0.0.0.0:80:80"
      # [HTTPS 전환 시] 아래 두 줄 주석 해제 + 공유기에서 443 포트포워딩 추가 필요
      - "0.0.0.0:443:443"
      - "0.0.0.0:443:443/udp"
    env_file:
      - ./.env.docker
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    networks:
      - frontend_net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # 1. Database Service (Postgres)
  postgres:
    image: postgres:13-alpine
    container_name: postgres_container
    # .env.docker 파일의 변수(POSTGRES_...)를 자동으로 컨테이너에 주입
    env_file:
      - ./.env.docker
    # [포트 매핑 제거] Windows WSL2/Hyper-V가 5432 포트를 선점하여 바인딩 오류 발생
    # 컨테이너끼리는 backend_net 내부 네트워크(DB_HOST=postgres)로 통신하므로 호스트 포트 불필요
    # 호스트(PC)에서 직접 DB 접속이 필요한 경우 아래 주석 해제 (단, 포트 충돌 주의)
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # 2. Backend Service
  backend:
    build: 
      context: ./Back
      dockerfile: Dockerfile
    container_name: backend_container
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    # 루트의 .env.docker 파일을 로드하여 Backend 컨테이너에 주입
    env_file:
      - ./.env.docker
      - ./Back/.env
    environment:
      # DB_HOST는 docker-compose 내부 통신을 위해 'postgres' 서비스명으로 고정
      - DB_HOST=postgres
    networks:
      - frontend_net
      - backend_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # 3. Frontend Service
  frontend:
    build: 
      context: ./Front
      dockerfile: Dockerfile
    container_name: frontend_container
    depends_on:
      - backend
    networks:
      - frontend_net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # 4. Kstock Service (Node.js / Hono) - KOSPI 실시간 WebSocket
  kstock:
    build:
      context: ./Kstock
      dockerfile: Dockerfile
    container_name: kstock_container
    env_file:
      - ./.env.docker
      - ./Back/.env
    environment:
      - KSTOCK_PORT=4000
      - KIS_MOCK=true
      - BACKEND_URL=http://backend:8000
    networks:
      - frontend_net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # 5. Chat Service (Rust)
  chat:
    build:
      context: ./Chat
      dockerfile: Dockerfile
    container_name: chat_container
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    env_file:
      - ./.env.docker
    environment:
      - PORT=3000
      - DB_HOST=postgres
    networks:
      - frontend_net
      - backend_net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge