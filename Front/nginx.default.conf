server {
    listen       8080;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # SPA 라우팅을 위해 파일이 없으면 index.html로 포워딩
        try_files $uri $uri/ /index.html;
        
        # Referrer Policy for YouTube embed compatibility
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # API 프록시 설정 (Reverse Proxy)
    # /api/로 시작하는 요청을 backend:8000으로 전달
    location /api/ {
        # /api/auth/login -> /auth/login 으로 변경하여 전달
        rewrite ^/api/(.*)$ /$1 break;
        
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_cache_bypass $http_upgrade;
    }

    # Chat WebSocket Proxy
    # /chat/ws 로 들어오는 요청만 Rust 서버(/ws)로 전달
    location /chat/ws {
        # /chat/ws -> /ws 로 rewrite 
        rewrite ^/chat/ws(.*)$ /ws$1 break;
        
        proxy_pass http://chat:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Chat Rest API Proxy
    location /chat/messages {
        # /chat/messages -> /messages 로 rewrite
        rewrite ^/chat/messages(.*)$ /messages$1 break;
        proxy_pass http://chat:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # Static File Proxy
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
